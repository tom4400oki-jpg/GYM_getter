name: テニス空き確認・自動デプロイ（等々力／富士見）

# テニスはコート数が多く（等々力10面＋富士見12面）1回あたり約20分かかるため、
# 体育館とは別ワークフローに分離している。体育館側のライブデータは scrape_fureai.py が
# 公開中JSONを書き戻して保持するので、デプロイで体育館データが退行することはない。
# 体育館と同じ concurrency グループで直列化される（20分＋6分 < 2時間間隔なので詰まらない）。

on:
  schedule:
    # 1日8回：JST 7,9,11,13,15,17,19,21（UTC 22,0,2,4,6,8,10,12）。体育館側と同一。
    - cron: "0 22,0,2,4,6,8,10,12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # 体育館ワークフローと同じグループにして同時デプロイを避ける
  group: scrape-deploy
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright ブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Python 依存インストール
        run: |
          pip install -r requirements-scrape.txt
          python -m playwright install --with-deps chromium

      - name: テニス空き状況スクレイプ
        id: scrape
        env:
          FUREAI_USER_ID: ${{ secrets.FUREAI_USER_ID }}
          FUREAI_PASSWORD: ${{ secrets.FUREAI_PASSWORD }}
          FUREAI_SECURITY_NUMBER: ${{ secrets.FUREAI_SECURITY_NUMBER }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
          SCRAPE_DAYS_AHEAD: "30"
          HEADLESS: "true"
          PYTHONUTF8: "1"
          SCRAPE_GROUP: "tennis"
        run: python scripts/scrape_fureai.py

      - name: Node セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Web ビルド
        if: steps.scrape.outputs.deploy == 'true'
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      # 認証実績のある公式アクションでデプロイ。ランナー→Google API の
      # "Premature close" で、リリース成功後の再送が "is the current active
      # version" 400 を返し step が失敗扱いになることがあるため continue-on-error。
      # 実際に反映されたかは次のステップでライブ内容を見て判定する。
      - name: Firebase Hosting へデプロイ
        if: steps.scrape.outputs.deploy == 'true'
        id: deploy
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: gym-getter
          channelId: live

      # ライブの data-tennis.json（テニス側で必ず更新するファイル）が
      # ビルド内容（updatedAt）に一致すれば反映済みとみなす。
      - name: デプロイ反映の検証
        if: steps.scrape.outputs.deploy == 'true'
        shell: bash
        run: |
          set -uo pipefail
          want="$(jq -r '.updatedAt' web/dist/data-tennis.json)"
          echo "ビルド済み updatedAt=$want"
          for i in 1 2 3 4 5 6; do
            live="$(curl -fsS "https://gym-getter.web.app/data-tennis.json?t=$(date +%s%N)" | jq -r '.updatedAt' 2>/dev/null || echo "")"
            echo "[$i] ライブ updatedAt=$live"
            if [ -n "$want" ] && [ "$live" = "$want" ]; then
              echo "ライブ反映を確認。デプロイ成功とみなします。"
              exit 0
            fi
            sleep 10
          done
          echo "::error::ライブにビルド内容が反映されていません（deploy outcome=${{ steps.deploy.outcome }}）。"
          exit 1
