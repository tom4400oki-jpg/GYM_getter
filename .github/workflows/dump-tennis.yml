name: テニスHTML調査（手動・1回限り）

# 等々力/富士見/多摩のテニス（時間貸し型）ページの HTML を吸い出して
# アーティファクトに保存するだけの調査用ワークフロー。予約操作はしない。
# パーサ実装が済んだら本ファイルは削除してよい。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存インストール
        run: |
          pip install -r requirements-scrape.txt
          python -m playwright install --with-deps chromium

      - name: テニスページHTML吸い出し
        env:
          FUREAI_USER_ID: ${{ secrets.FUREAI_USER_ID }}
          FUREAI_PASSWORD: ${{ secrets.FUREAI_PASSWORD }}
          FUREAI_SECURITY_NUMBER: ${{ secrets.FUREAI_SECURITY_NUMBER }}
          HEADLESS: "true"
          PYTHONUTF8: "1"
        run: python scripts/dump_tennis_html.py

      - name: HTMLをアーティファクト化
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tennis-html
          path: tennis_html/
          if-no-files-found: warn
