name: 体育館 空き確認・自動デプロイ（1日2回 9時/21時）

on:
  schedule:
    # 1日2回：JST 9:00 と 21:00（UTC 0:00 / 12:00）。
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scrape-deploy
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright ブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Python 依存インストール
        run: |
          pip install -r requirements-scrape.txt
          python -m playwright install --with-deps chromium

      - name: 空き状況スクレイプ
        id: scrape
        env:
          FUREAI_USER_ID: ${{ secrets.FUREAI_USER_ID }}
          FUREAI_PASSWORD: ${{ secrets.FUREAI_PASSWORD }}
          FUREAI_SECURITY_NUMBER: ${{ secrets.FUREAI_SECURITY_NUMBER }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # 管理者向けエラー通知の宛先（任意。未設定なら Actions 注釈＋ジョブ失敗のみ）
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
          SCRAPE_DAYS_AHEAD: "30"
          HEADLESS: "true"
          PYTHONUTF8: "1"
          # 体育館のみ高頻度で取得（テニスは scrape-tennis.yml で1日1回）
          SCRAPE_GROUP: "hall"
        run: python scripts/scrape_takatsu.py

      - name: Node セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Web ビルド
        if: steps.scrape.outputs.deploy == 'true'
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Firebase Hosting へデプロイ
        if: steps.scrape.outputs.deploy == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: gym-getter
          channelId: live
