name: 体育館 空き確認・自動デプロイ（1日8回 7〜21時）

on:
  schedule:
    # 1日8回：JST 7,9,11,13,15,17,19,21時台（UTC 22,0,2,4,6,8,10,12）。
    # 毎時0分ジャストの混雑によるスケジュール遅延・スキップを避けるためオフピークの7分に設定。
    - cron: "7 22,0,2,4,6,8,10,12 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "データ無変化でも強制デプロイ（web側の変更を反映したい時）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scrape-deploy
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright ブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements-scrape.txt') }}

      - name: Python 依存インストール
        run: |
          pip install -r requirements-scrape.txt
          python -m playwright install --with-deps chromium

      # スクレイプ前に純粋関数の単体テストを回す（数秒。壊れたロジックでの本番実行を防ぐ）
      - name: 単体テスト
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: 空き状況スクレイプ
        id: scrape
        shell: bash
        env:
          FUREAI_USER_ID: ${{ secrets.FUREAI_USER_ID }}
          FUREAI_PASSWORD: ${{ secrets.FUREAI_PASSWORD }}
          FUREAI_SECURITY_NUMBER: ${{ secrets.FUREAI_SECURITY_NUMBER }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # 管理者向けエラー通知の宛先（任意。未設定なら Actions 注釈＋ジョブ失敗のみ）
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
          SCRAPE_DAYS_AHEAD: "30"
          HEADLESS: "true"
          PYTHONUTF8: "1"
          # 体育館のみ高頻度で取得（テニスは scrape-tennis.yml で実行）
          SCRAPE_GROUP: "hall"
          # 手動実行で force_deploy を指定した時のみ true。データ無変化でもデプロイする。
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: |
          set -o pipefail
          python scripts/scrape_fureai.py --defer-notify 2>&1 | tee scrape_output.log

      - name: Node セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Web ビルド
        if: steps.scrape.outputs.deploy == 'true'
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      # 認証実績のある公式アクションでデプロイ。
      # firebase-tools@15.34.1 以降は Service Usage API (serviceusage.services.get) を要求し
      # Hosting 用サービスアカウントで 403 になるため、動作確認済みの 15.34.0 にピン留めする。
      # また "Premature close" による再送 400 に備えて continue-on-error とし、次ステップで実反映を検証する。
      - name: Firebase Hosting へデプロイ
        if: steps.scrape.outputs.deploy == 'true'
        id: deploy
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: gym-getter
          channelId: live
          firebaseToolsVersion: "15.34.0"

      # 毎実行必ず最新タイムスタンプで生成される facilities.json の updatedAt を
      # ライブ環境と比較することで、特定施設の取得成否に左右されず確実に反映を検証する。
      - name: デプロイ反映の検証
        if: steps.scrape.outputs.deploy == 'true'
        id: verify
        shell: bash
        run: |
          set -uo pipefail
          want="$(jq -r '.updatedAt' web/dist/facilities.json)"
          echo "ビルド済み facilities.json updatedAt=$want"
          for i in $(seq 1 10); do
            live="$(curl -fsS --connect-timeout 5 --max-time 10 "https://gym-getter.web.app/facilities.json?t=$(date +%s%N)" | jq -r '.updatedAt' 2>/dev/null || echo "")"
            echo "[$i/10] ライブ updatedAt=$live"
            if [ -n "$want" ] && [ "$live" = "$want" ]; then
              echo "ライブ反映を確認。デプロイ成功とみなします。"
              exit 0
            fi
            sleep 10
          done
          echo "::error::ライブにビルド内容が反映されていません（deploy outcome=${{ steps.deploy.outcome }}）。"
          exit 1

      # デプロイ反映が確認できた後に初めて利用者向け LINE ブロードキャストを送信する
      # （デプロイ失敗時に未更新のサイトへ誘導したり、次回実行で同じ通知が連投されるのを防止）
      - name: LINE 通知送信（デプロイ反映後）
        if: steps.scrape.outputs.deploy == 'true' && steps.verify.outcome == 'success'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
          PYTHONUTF8: "1"
        run: python scripts/scrape_fureai.py --flush-notify

      - name: デプロイ失敗時の管理者通知
        if: failure() && steps.scrape.outputs.deploy == 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
          PYTHONUTF8: "1"
        run: |
          python scripts/scrape_fureai.py --notify-admin "体育館デプロイ反映失敗 (run=${{ github.run_id }}, deploy=${{ steps.deploy.outcome }}, verify=${{ steps.verify.outcome }})"

      - name: チャット貼付用ログの出力
        if: always()
        shell: bash
        run: |
          {
            echo "### 📋 チャット貼付用 診断ログ（右上のコピーボタンでコピーできます）"
            echo '```text'
            echo "Workflow: ${{ github.workflow }} (run_id=${{ github.run_id }})"
            echo "Steps: scrape=${{ steps.scrape.outcome }} / deploy_flag=${{ steps.scrape.outputs.deploy }} / firebase_deploy=${{ steps.deploy.outcome }} / verify=${{ steps.verify.outcome }}"
            if [ -f .scrape_summary.md ]; then
              cat .scrape_summary.md
            fi
            if [ -f scrape_output.log ]; then
              echo "--- console log (tail 35) ---"
              tail -n 35 scrape_output.log
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
