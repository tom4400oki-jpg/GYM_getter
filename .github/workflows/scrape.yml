name: 体育館 空き確認・自動デプロイ（1日8回 7〜21時）

on:
  schedule:
    # 1日8回：JST 7,9,11,13,15,17,19,21（UTC 22,0,2,4,6,8,10,12）。
    # 深夜帯は予約枠がほぼ動かず、ふれあいネットのメンテ時間とも重なるため、
    # 同じ8回を日中に寄せて通知の鮮度を上げている。
    - cron: "0 22,0,2,4,6,8,10,12 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "データ無変化でも強制デプロイ（web側の変更を反映したい時）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scrape-deploy
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright ブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Python 依存インストール
        run: |
          pip install -r requirements-scrape.txt
          python -m playwright install --with-deps chromium

      # スクレイプ前に純粋関数の単体テストを回す（数秒。壊れたロジックでの本番実行を防ぐ）
      - name: 単体テスト
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: 空き状況スクレイプ
        id: scrape
        env:
          FUREAI_USER_ID: ${{ secrets.FUREAI_USER_ID }}
          FUREAI_PASSWORD: ${{ secrets.FUREAI_PASSWORD }}
          FUREAI_SECURITY_NUMBER: ${{ secrets.FUREAI_SECURITY_NUMBER }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # 管理者向けエラー通知の宛先（任意。未設定なら Actions 注釈＋ジョブ失敗のみ）
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
          SCRAPE_DAYS_AHEAD: "30"
          HEADLESS: "true"
          PYTHONUTF8: "1"
          # 体育館のみ高頻度で取得（テニスは scrape-tennis.yml で1日1回）
          SCRAPE_GROUP: "hall"
          # 手動実行で force_deploy を指定した時のみ true。データ無変化でもデプロイする。
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: python scripts/scrape_fureai.py

      - name: Node セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Web ビルド
        if: steps.scrape.outputs.deploy == 'true'
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      # 認証実績のある公式アクションでデプロイ。ランナー→Google API の
      # "Premature close" で、リリース成功後の再送が "is the current active
      # version" 400 を返し step が失敗扱いになることがあるため continue-on-error。
      # 実際に反映されたかは次のステップでライブ内容を見て判定する。
      - name: Firebase Hosting へデプロイ
        if: steps.scrape.outputs.deploy == 'true'
        id: deploy
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: gym-getter
          channelId: live

      # ライブの data.json がビルド内容（updatedAt）に一致すれば、アクションが
      # 失敗扱いでも実際には反映済み（差分なし/再送由来の誤検知）とみなす。
      - name: デプロイ反映の検証
        if: steps.scrape.outputs.deploy == 'true'
        shell: bash
        run: |
          set -uo pipefail
          want="$(jq -r '.updatedAt' web/dist/data.json)"
          echo "ビルド済み updatedAt=$want"
          for i in 1 2 3 4 5 6; do
            live="$(curl -fsS "https://gym-getter.web.app/data.json?t=$(date +%s%N)" | jq -r '.updatedAt' 2>/dev/null || echo "")"
            echo "[$i] ライブ updatedAt=$live"
            if [ -n "$want" ] && [ "$live" = "$want" ]; then
              echo "ライブ反映を確認。デプロイ成功とみなします。"
              exit 0
            fi
            sleep 10
          done
          echo "::error::ライブにビルド内容が反映されていません（deploy outcome=${{ steps.deploy.outcome }}）。"
          exit 1
