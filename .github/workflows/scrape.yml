name: 体育館 空き確認・自動デプロイ（1日2回 9時/21時）

on:
  schedule:
    # 1日2回：JST 9:00 と 21:00（UTC 0:00 / 12:00）。
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scrape-deploy
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright ブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Python 依存インストール
        run: |
          pip install -r requirements-scrape.txt
          python -m playwright install --with-deps chromium

      - name: 空き状況スクレイプ
        id: scrape
        env:
          FUREAI_USER_ID: ${{ secrets.FUREAI_USER_ID }}
          FUREAI_PASSWORD: ${{ secrets.FUREAI_PASSWORD }}
          FUREAI_SECURITY_NUMBER: ${{ secrets.FUREAI_SECURITY_NUMBER }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # 管理者向けエラー通知の宛先（任意。未設定なら Actions 注釈＋ジョブ失敗のみ）
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
          SCRAPE_DAYS_AHEAD: "30"
          HEADLESS: "true"
          PYTHONUTF8: "1"
          # 体育館のみ高頻度で取得（テニスは scrape-tennis.yml で1日1回）
          SCRAPE_GROUP: "hall"
        run: python scripts/scrape_takatsu.py

      - name: Node セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Web ビルド
        if: steps.scrape.outputs.deploy == 'true'
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Firebase Hosting へデプロイ
        if: steps.scrape.outputs.deploy == 'true'
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # ランナー→Google API 間の "Premature close"（一過性の切断）対策。
          # firebase-tools 内部のリトライが成功済みリリースを再送し
          # "is the current active version" 400 を返すことがあるため、
          # ここでは (1) 最大3回リトライ (2) 差分なし/再送由来の上記エラーは成功扱い とする。
          # GitHub の shell: bash は既定で -e（errexit）が付き、npx 失敗時に
          # リトライ処理へ入る前に即終了してしまうため、ここで明示的に無効化する。
          set +e
          set -uo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          max=3
          attempt=1
          while :; do
            echo "::group::Firebase deploy (attempt $attempt/$max)"
            out="$(npx -y firebase-tools@latest deploy --only hosting --project gym-getter --non-interactive 2>&1)"
            status=$?
            echo "$out"
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              echo "デプロイ成功"
              break
            fi
            if printf '%s' "$out" | grep -q "is the current active version"; then
              echo "差分なし（既に最新がライブ）。成功扱いにします。"
              break
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "デプロイが $max 回失敗しました。"
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "一過性エラーの可能性。15秒後に再試行します..."
            sleep 15
          done
