<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GYM Getter - 川崎市高津区 施設空き確認</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>🏀 GYM Getter</h1>
      <p class="subtitle">川崎市高津区 体育館・テニスコート 空き確認システム</p>
    </div>
    <div class="header-actions">
      <button id="btn-check-all" class="btn btn-primary">全施設チェック</button>
      <button id="btn-detect-all" class="btn btn-secondary">フロー検出</button>
      <span id="last-updated" class="last-updated"></span>
    </div>
  </header>

  <main>
    <!-- タブ -->
    <nav class="tabs">
      <button class="tab-btn active" data-tab="availability">空き状況</button>
      <button class="tab-btn" data-tab="flow">予約フロー</button>
      <button class="tab-btn" data-tab="logs">実行ログ</button>
    </nav>

    <!-- 空き状況タブ -->
    <section id="tab-availability" class="tab-content active">
      <div class="filter-bar">
        <select id="filter-facility">
          <option value="">全施設</option>
        </select>
        <select id="filter-status">
          <option value="">全ステータス</option>
          <option value="available">空き ○</option>
          <option value="lottery">抽選 △</option>
          <option value="occupied">使用中 ×</option>
          <option value="closed">休館</option>
        </select>
        <input type="date" id="filter-date-from" placeholder="開始日">
        <span>〜</span>
        <input type="date" id="filter-date-to" placeholder="終了日">
        <button id="btn-filter" class="btn btn-small">絞り込み</button>
      </div>

      <div id="availability-summary" class="summary-bar"></div>

      <div id="availability-grid" class="slot-grid">
        <div class="loading">データを読み込み中...</div>
      </div>
    </section>

    <!-- 予約フロータブ -->
    <section id="tab-flow" class="tab-content">
      <div class="facility-selector">
        <label>施設を選択：</label>
        <div id="facility-buttons" class="btn-group"></div>
      </div>
      <div id="flow-steps" class="flow-container">
        <p class="placeholder">施設を選択するか「フロー検出」を実行してください。</p>
      </div>
    </section>

    <!-- ログタブ -->
    <section id="tab-logs" class="tab-content">
      <table id="log-table" class="log-table">
        <thead>
          <tr>
            <th>日時</th>
            <th>施設</th>
            <th>タスク</th>
            <th>ステータス</th>
            <th>件数</th>
            <th>エラー</th>
          </tr>
        </thead>
        <tbody id="log-tbody">
          <tr><td colspan="6" class="loading">読み込み中...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <!-- スクリーンショットモーダル -->
  <div id="screenshot-modal" class="modal hidden">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-content">
      <button class="modal-close" id="modal-close">×</button>
      <img id="modal-img" src="" alt="スクリーンショット">
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
